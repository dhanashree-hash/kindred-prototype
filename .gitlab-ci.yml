include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - lint
  - test
  - security
  - build
  - deploy

default:
  image: node:18-alpine

# ── Stage 1: Lint ─────────────────────────────────────────────────────────────
lint:
  stage: lint
  before_script:
    - npm ci
  script:
    - echo "Running ESLint..."
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ── Stage 2: Test ─────────────────────────────────────────────────────────────
test:
  stage: test
  before_script:
    - npm ci
  script:
    - echo "Running Jest tests..."
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ── Stage 3: Security scanning ────────────────────────────────────────────────
# Two scanners run in the security stage:
#   semgrep-sast     — static analysis, catches code-level vulnerabilities
#   secret_detection — scans for hardcoded credentials, tokens, keys
#
# allow_failure: false means the pipeline BLOCKS on any finding.
# The build and deploy stages will not run until security is clean.

semgrep-sast:
  stage: security
  allow_failure: false

secret_detection:
  stage: security
  allow_failure: false

# ── Stage 4: Build ────────────────────────────────────────────────────────────
build:
  stage: build
  before_script:
    - npm ci
  script:
    - echo "✅ All quality gates passed."
    - echo "✅ Kindred prototype is clean and ready for release."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ── Stage 5: Deploy (simulated) ───────────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  before_script: []
  script:
    - echo "🚀 Deploying Kindred to staging environment..."
    - sleep 2
    - echo "✅ Deployment complete — app is live at staging.kindred.app"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
