include:
  - template: Security/SAST.gitlab-ci.yml

stages:
  - lint
  - test
  - sast
  - build
  - deploy

default:
  image: node:18-alpine
  before_script:
    - npm ci

# ── Stage 1: Lint ─────────────────────────────────────────────────────────────
lint:
  stage: lint
  script:
    - echo "Running ESLint..."
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ── Stage 2: Test ─────────────────────────────────────────────────────────────
test:
  stage: test
  script:
    - echo "Running Jest tests..."
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ── Stage 3: SAST ─────────────────────────────────────────────────────────────
# Provided automatically by the Security/SAST.gitlab-ci.yml template above.
# Scans JavaScript source with Semgrep and reports findings in the MR Security tab.
# No manual job definition required here.

# ── Stage 4: Build ────────────────────────────────────────────────────────────
build:
  stage: build
  script:
    - echo "✅ All quality gates passed."
    - echo "✅ Kindred prototype is clean and ready for release."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ── Stage 5: Deploy (simulated) ───────────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  before_script: []
  script:
    - echo "🚀 Deploying Kindred to staging environment..."
    - sleep 2
    - echo "✅ Deployment complete — app is live at staging.kindred.app"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
